<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoonPaw</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      text-align: center;
    }

    .app {
      max-width: 430px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      font-size: 32px;
      margin: 10px 0 5px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .balance {
      background: #151c33;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 25px;
    }

    .points {
      font-size: 42px;
      font-weight: bold;
    }

    .label {
      color: #9ca3af;
      margin-top: 5px;
    }

    .tap-button {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      border: none;
      font-size: 70px;
      background: #6d5dfc;
      box-shadow: 0 10px 35px rgba(109, 93, 252, 0.35);
      cursor: pointer;
      margin: 10px 0 30px;
    }

    .tap-button:active {
      transform: scale(0.94);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

      padding: 17px 10px;
      border: none;
      border-radius: 15px;
